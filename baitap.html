      width: 100%; aspect-ratio: 4 / 3; padding: 16px; box-sizing: border-box;
      border: 3px solid #1d2b2a; background-color: #dfe6e4;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      font-size: 1.1rem; text-align: center; font-weight: bold;
    }
    .gallery { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    .preview {
      width: calc(33.333% - 8px); min-width: 120px; aspect-ratio: 4 / 3;
      object-fit: cover; border: 3px solid transparent; cursor: pointer; box-sizing: border-box;
    }
    .preview:hover, .preview:focus { border-color: #b4562c; outline: 3px solid #1d2b2a; outline-offset: 2px; }
    @media (max-width: 480px) { .preview { width: calc(50% - 6px); } }
  </style>

  <script>
    var defaultText = "Di chuột qua hoặc nhấn Tab tới một hình bên dưới để hiển thị tại đây.";

    function upDate(previewPic) {
      console.log("Sự kiện upDate được kích hoạt: " + previewPic.alt);
      var display = document.getElementById("image");
      display.style.backgroundImage = "url('" + previewPic.src + "')";
      display.textContent = previewPic.alt;
    }

    function unDo() {
      console.log("Sự kiện unDo được kích hoạt");
      var display = document.getElementById("image");
      display.style.backgroundImage = "none";
      display.textContent = defaultText;
    }

    function addTabFocus() {
      console.log("Sự kiện onload được kích hoạt");
      var images = document.querySelectorAll(".preview");
      for (var i = 0; i < images.length; i++) {
        images[i].setAttribute("tabindex", "0");
        console.log("Đã thêm tabindex cho hình " + (i + 1));
      }
    }
  </script>
